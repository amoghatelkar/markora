<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="Markora">
  <defs>
    <linearGradient id="bgBase" x1="96" y1="64" x2="416" y2="448" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14141c"/>
      <stop offset="0.5" stop-color="#09090f"/>
      <stop offset="1" stop-color="#040406"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 200) rotate(90) scale(300 340)">
      <stop stop-color="#3d3a5c" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#12121a" stop-opacity="0"/>
      <stop offset="1" stop-color="#09090f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="128" y1="96" x2="384" y2="416" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9ca3af" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#f9fafb" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#6b7280" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="metalStroke" x1="108" y1="160" x2="404" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="0.18" stop-color="#e5e7eb"/>
      <stop offset="0.45" stop-color="#9ca3af"/>
      <stop offset="0.72" stop-color="#d1d5db"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="metalHighlight" x1="140" y1="140" x2="320" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="ribbonShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="118" fill="url(#bgBase)"/>
  <rect width="512" height="512" rx="118" fill="url(#bgGlow)"/>
  <rect x="10" y="10" width="492" height="492" rx="108" stroke="url(#rim)" stroke-width="1.5"/>

  <g filter="url(#ribbonShadow)">
    <!-- Infinity ribbon — single continuous stroke -->
    <path
      d="M 156 268
         C 156 196, 210 168, 252 208
         C 282 236, 298 236, 328 208
         C 370 168, 424 196, 424 268
         C 424 340, 370 368, 328 328
         C 298 300, 282 300, 252 328
         C 210 368, 156 340, 156 268 Z"
      fill="none"
      stroke="url(#metalStroke)"
      stroke-width="46"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 188 238
         C 204 210, 234 202, 258 222
         C 276 238, 290 238, 308 222
         C 332 202, 362 210, 378 238"
      fill="none"
      stroke="url(#metalHighlight)"
      stroke-width="14"
      stroke-linecap="round"
      opacity="0.75"
    />
  </g>
</svg>
